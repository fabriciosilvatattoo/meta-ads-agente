  <style>
    *,

      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

      background: #0f1115;

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #2d303b;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3d404b;
    }
